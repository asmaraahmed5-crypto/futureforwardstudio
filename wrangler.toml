name = "futureforwardstudio"
main = "worker/index.js"
workers_dev = false
preview_urls = false
compatibility_date = "2024-09-23"

routes = [
  { pattern = "futureforwardstudio.com", custom_domain = true },
  { pattern = "www.futureforwardstudio.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
